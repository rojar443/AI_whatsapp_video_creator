# Initial single-instance deployment with local video storage. See docs/RENDER.md.
services:
  - type: web
    name: AI_whatsapp_video_creator
    runtime: docker
    branch: agenticorg_dep
    region: singapore
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: reelchat-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reelchat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reelchat-queue
          type: keyvalue
          property: connectionString
      - key: TASK_BACKEND
        value: celery
      - key: RENDER_DATA_DIR
        value: /var/data
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/storage
      - key: WORK_DIR
        value: /var/data/work
      - key: PLAYBOOK_DIR
        value: /app/playbooks
      - key: MUSIC_LIBRARY_DIR
        value: /app/music
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: FFPROBE_PATH
        value: ffprobe
      - key: FFMPEG_THREADS
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://ai-whatsapp-video-creator-ygko.onrender.com
      - key: WEB_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Provider credentials/settings already on the existing service are preserved.
      # Configure provider settings securely before the first production job.

  - type: keyvalue
    name: reelchat-queue
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: reelchat-web
    runtime: docker
    branch: agenticorg_dep
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          name: AI_whatsapp_video_creator
          type: web
          property: hostport
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: "10000"

# Reuse the existing database and its current plan; do not replace or upgrade it.
databases:
  - name: reelchat-postgres
    databaseName: reelchat_postgres
    user: reelchat
    region: singapore
    postgresMajorVersion: "18"

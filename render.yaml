# Reuse the existing backend, disk, Postgres and queue in My Workspace (Singapore).
# Postgres and Key Value stay externally managed; this Blueprint does not resize them.
services:
  - type: web
    name: AI_whatsapp_video_creator
    runtime: docker
    branch: prod_v2
    region: singapore
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    dockerCommand: python -m app.render_runtime
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: reelchat-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reelchat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reelchat-queue
          type: keyvalue
          property: connectionString
      - key: PORT
        value: "10000"
      - key: RENDER_DATA_DIR
        value: /var/data
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/storage
      - key: WORK_DIR
        value: /var/data/work
      - key: TASK_BACKEND
        value: celery
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: FFMPEG_THREADS
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Existing AI, messaging, and email settings are preserved when omitted.

  - type: web
    name: reelchat-web
    runtime: docker
    branch: prod_v2
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          name: AI_whatsapp_video_creator
          type: web
          property: hostport
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: 0.0.0.0
